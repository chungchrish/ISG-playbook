<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apollo ISG — Secure Access</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root { --gold:#C9A84C; --navy:#0D1B2E; --navy-mid:#1A2D45; --white:#FEFEFE; --red:#D64545; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  #login-screen { text-align:center; padding:40px clamp(24px,8vw,60px); max-width:420px; width:100%; }
  .lock-icon { width:56px; height:56px; border:2px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; font-size:24px; }
  .login-eyebrow { font-size:11px; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  .login-title { font-family:'DM Serif Display',serif; font-size:28px; color:var(--white); margin-bottom:6px; }
  .login-subtitle { font-family:'DM Serif Display',serif; font-size:16px; color:var(--gold); font-style:italic; margin-bottom:32px; }
  #pw { width:100%; padding:14px 18px; font-family:'DM Sans',sans-serif; font-size:14px; background:var(--navy-mid); border:1px solid rgba(201,168,76,0.3); border-radius:8px; color:var(--white); outline:none; margin-bottom:16px; }
  #pw::placeholder { color:rgba(255,255,255,0.35); }
  #pw:focus { border-color:var(--gold); }
  #pw.error { border-color:var(--red); animation:shake 0.4s ease; }
  #submit-btn { width:100%; padding:14px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; background:var(--gold); color:var(--navy); border:none; border-radius:8px; cursor:pointer; }
  #submit-btn:disabled { opacity:0.5; cursor:wait; }
  #error-msg { color:var(--red); font-size:13px; margin-top:12px; min-height:20px; }
  .login-footer { margin-top:32px; font-size:11px; color:rgba(255,255,255,0.25); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
</style>
</head>
